[project]
name = "ethiopian-document-verification-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "henok444", email = "novelopp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pathlib>=1.0.1",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
ethiopian-document-verification-system = "ethiopian_document_verification_system:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY", "PD"]  # errors, pyflakes, import sorting, modern syntax, bugbear, numpy, pandas
